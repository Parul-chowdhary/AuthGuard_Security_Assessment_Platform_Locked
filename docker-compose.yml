version: '3.8'

services:
  authguard-web:
    build: .
    container_name: authguard_web
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./storage/authguard.db
      - SECRET_KEY=authguard-production-docker-secret-key-32bytes-min!
      - ALLOW_LOCAL_TARGETS_FOR_TESTING=true
    volumes:
      - authguard_storage:/app/storage
    restart: unless-stopped

  authguard-lab:
    build: .
    container_name: authguard_demo_lab
    ports:
      - "8001:8001"
    command: ["uvicorn", "lab.demo_auth_app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped

volumes:
  authguard_storage:
